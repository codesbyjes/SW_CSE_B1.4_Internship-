<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback function</title>
</head>
<body>
    <button id="runBtn">Run Task</button>
    <pre id="output"></pre>
    <script>
        const output = document.getElementById("output");
        const runBtn = document.getElementById("runBtn");

        function log(msg){
            output.textContent += msg + "\n";
            console.log(msg);
        }

        function performTask(taskName,callback){
            log("Task Started: "+taskName);
            setTimeout(()=>{
            log("Task Finished: "+taskName);
            callback("Result of: "+taskName);
            },1500);
        }
        
        runBtn.addEventListener("click",() => {
            performTask("Download data",(result)=>{
                log("Callback received:"+result);
            });
        });
    </script>
</body>
</html>
