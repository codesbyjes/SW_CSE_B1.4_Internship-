<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fetch API - Example 2</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { padding: 6px 10px; margin: 4px 0; }
    pre { background: #f5f5f5; padding: 8px; }
  </style>
</head>
<body>
  <h2>Fetch API Example 2</h2>

  <input id="titleInput" type="text" placeholder="Enter title" />
  <button id="sendBtn">Send Post</button>

  <pre id="output"></pre>

  <script>
    const titleInput = document.getElementById("titleInput");
    const sendBtn = document.getElementById("sendBtn");
    const output = document.getElementById("output");

    sendBtn.addEventListener("click", async () => {
      const title = titleInput.value.trim();

      if (!title) {
        output.textContent = "Please enter a title.";
        return;
      }

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: title,
            body: "This is a sample post body",
            userId: 1
          })
        });

        if (!response.ok) {
          throw new Error("Post request failed");
        }

        const result = await response.json();
        output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        output.textContent = "Error: " + error.message;
        console.log(error)
      }
    });
  </script>
</body>
</html>
